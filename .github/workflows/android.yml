name: Build Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          (set +o pipefail; yes | "$sdkmanager" --licenses)
          "$sdkmanager" "platforms;android-36" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK and Android App Bundle
        working-directory: heza-media/android
        run: gradle :app:assembleDebug :app:bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: heza-media-android
          path: |
            heza-media/android/app/build/outputs/apk/debug/app-debug.apk
            heza-media/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
