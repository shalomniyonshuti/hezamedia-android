plugins {
    id 'com.android.application' version '8.13.2'
}

android {
    namespace 'com.hezamedia.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.hezamedia.app'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }

    sourceSets {
        main.assets.srcDirs = ['../../web']
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
